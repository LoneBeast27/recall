[package]
name = "recall-overlay"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lightweight native status overlay for Recall (the Recall Island)"

[[bin]]
name = "recall-overlay"
path = "src/main.rs"

[dependencies]
interprocess = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # Frame timing (FPS + 1% low): a real-time ETW session on Windows' present
    # events, QPC timestamps, and session cleanup on console close.
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    # EVENT_TRACE_LOGFILEW (OpenTraceW) carries a TIME_ZONE_INFORMATION.
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # The per-session controller pipe name (`pipe_name`).
    "Win32_System_RemoteDesktop",
    # The pipe server's account check (`pipe_owner`).
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[build-dependencies]
# VERSIONINFO + asInvoker manifest (../recall/build_winres.rs); already in recall-native's tree.
embed-resource = "3"
