[package]
name = "recall-overlay"
version = "0.0.1"
edition = "2021"
description = "Lightweight native status overlay for Recall"

[[bin]]
name = "recall-overlay"
path = "src/main.rs"

[dependencies]
interprocess = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
