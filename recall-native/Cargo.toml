[package]
name = "recall-native"
version = "0.1.0"
edition = "2024"
description = "Recall native GPUI editor"

[workspace]

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi",
    "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Media_MediaFoundation",
    "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
] }

