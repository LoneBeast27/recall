[workspace]
resolver = "2"
members = ["recall", "recall-fixes", "recall-hdr", "recall-nvidia", "recall-overlay", "recall-trace"]

# recall-hdr (HDR display-manager companion utility) is added by a separate session;
# see Agents/Claude/PRDs/recall-hdr-manager-build-brief.md

# Dev builds: lightly optimize the engine crate itself (its save path's plane
# fill / packet merge); FFmpeg is already a prebuilt optimized DLL. Measured
# 2026-10-22 on a 119 s live-shaped save (CPU bench): writer 1690 -> 1554 ms,
# incremental rebuild +0.3 s. opt-level 2 bought 2% more for +1 s per rebuild.
[profile.dev.package.recall]
opt-level = 1

# Release: whole-program optimization, one codegen unit, no symbols in the shipped exes.
# panic stays "unwind" on purpose: the saver, mover, disk lanes and HDR guard catch a
# panic with catch_unwind and keep running; "abort" would end the recorder instead.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# Same code as release, with line tables in a PDB, for CPU traces (cargo build --profile profiling).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
