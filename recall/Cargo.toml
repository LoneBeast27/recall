[package]
name = "recall"
version = "0.0.1"
edition = "2021"
description = "Lean HDR-aware clip recorder + live HDR->SDR source (Windows)"

[features]
default = ["encode"]
# Video encode + mux via libav (ffmpeg-next). Build needs:
#   FFMPEG_DIR    -> tools/ffmpeg-dev/ffmpeg-n7.1-latest-win64-gpl-shared-7.1
#   LIBCLANG_PATH -> a dir containing libclang.dll (pip package `libclang` works)
# Runtime needs the FFmpeg bin/ DLLs next to recall.exe or on PATH.
encode = ["dep:ffmpeg-next", "dep:uuid", "dep:wasapi"]

[dependencies]
# No "device" feature: nothing here opens a capture device, and it made recall.exe load avdevice-61.dll.
ffmpeg-next = { version = "7.1", optional = true, default-features = false, features = ["codec", "format", "filter", "software-resampling", "software-scaling"] }
wasapi = { version = "0.19", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Windows only: no X11/Wayland backends.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# The CPU-fallback tonemap path only: D3D12 + WGSL. No Vulkan, GL (opengl32.dll import) or Metal.
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
pollster = "0.4"
windows-capture = "2.0"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The #[implement] macro (audio/notify.rs) names windows_core directly.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
