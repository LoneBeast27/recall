[package]
name = "recall"
version = "0.0.1"
edition = "2021"
description = "Lean HDR-aware clip recorder + live HDR->SDR source (Windows)"

[dependencies]
winit = "0.30"
wgpu = "29"
pollster = "0.4"
windows-capture = "2.0"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
