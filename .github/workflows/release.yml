# Release build: the Recall executables (recall-native, recall, recall-hdr, recall-overlay), the
# uninstaller and the C# Setup, on GitHub-hosted runners, from the checked-out (tagged) source.
# CPU-only tests run alongside the builds (tests that need NVENC, an audio device or a live game
# are #[ignore]d). The checks and the two release builds run as parallel jobs:
#   prepare          signing gate, release version, the on-main check            (ubuntu, seconds)
#   recorder-tests   app-tests   setup-tests   compat                            (the checks)
#   release-recorder release-app                                                 (fat LTO, cgu=1)
#   build            needs ALL of the above: assembles and checks the payload, builds the uninstaller,
#                    uploads the unsigned payload. Nothing is signed or bundled before every check passed.
#
# Code signing (CODE_SIGNING_POLICY.md) runs only when the SIGNPATH_API_TOKEN secret is set.
# Every shipped executable is signed, not only Setup, in this order:
#   1. build        (after the checks and release builds) the unsigned payload
#   2. sign-payload SignPath signs the five payload exes          (approval: release-signing)
#   3. setup        Setup is built around the SIGNED payload and uninstaller; it also needs every
#                   check job directly, so a failed check always blocks the installer
#   4. sign-setup   SignPath signs RecallSetup.exe                (approval: release-signing)
# Configure required reviewers on the `release-signing` environment: that is the manual approval
# for each release (one approval per signing job). Without the secret both signing jobs are
# skipped, Setup is built around the unsigned payload, and the workflow still succeeds.
# Repository variables used by signing:
#   SIGNPATH_ORGANIZATION_ID (required), SIGNPATH_PROJECT_SLUG (default "recall"),
#   SIGNPATH_PAYLOAD_POLICY_SLUG / SIGNPATH_SETUP_POLICY_SLUG (default "release-signing"),
#   SIGNPATH_PAYLOAD_CONFIG_SLUG (default "payload"), SIGNPATH_SETUP_CONFIG_SLUG (default "setup").
# The SignPath artifact configurations are in .signpath/.
#
# Caches (actions/cache; only build outputs and downloads this workflow makes, never a secret):
#   ffmpeg archive, cargo registry      .github/actions/windows-build-env
#   recorder-tests / app-tests          target-dev / target-gpui (dev profile, third-party crates only)
#   compat                              target-compat (the previous release's dev builds)
#   release-recorder / release-app      the release profile's THIRD-PARTY crates only, keyed on the
#                                       runner image + toolchain + libclang + Cargo.lock, never
#                                       restored across images. Every Recall crate is cleaned after
#                                       the restore, so the shipped exes are always compiled and
#                                       fat-LTO linked from this checkout.
# Before a save, every Recall crate's artifacts are removed (cargo clean -p), so a cache holds
# third-party crates only. A cache is saved only by a successful job, and only when its key missed.
# Cache scope: a tag run restores caches from main (and its own tag) only. Dispatch this workflow on
# main (empty version) after a merge that changes a Cargo.lock or the toolchain, or the next tag
# run builds cold.
#
# Every executable is checked for ProductName "Recall" and the same version before signing.
# A tag build must be on main. Every third-party action is pinned to a full commit SHA.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (major.minor.patch). Empty: an unversioned build (no update checks)."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

# This workflow builds (and signs, once configured); it does not publish. Release notes start
# from .github/RELEASE_NOTES_TEMPLATE.md. Releases are unsigned for now: when signing is turned
# on, put the signer's credit line back into that template, the README and CODE_SIGNING_POLICY.md.
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      signing: ${{ steps.gate.outputs.configured }}
      version: ${{ steps.version.outputs.version }}
      bundle: ${{ steps.version.outputs.bundle }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The on-main check below needs main's history.
          fetch-depth: 0

      - name: Signing gate
        id: gate
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $configured = if ($env:SIGNPATH_API_TOKEN) { 'true' } else { 'false' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "configured=$configured"
          "Code signing configured: $configured"

      - name: Release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION }
          if ($version -and $version -notmatch '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$') {
            throw "Not a major.minor.patch version: '$version'"
          }
          if ($version) {
            # The updater only offers a release whose tag is on main: a versioned build (a tag push
            # or a manual run with a version) must be of a commit on main.
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw "Version ${version}: $env:GITHUB_REF_NAME ($env:GITHUB_SHA) is not on main." }
          }
          $suffix = if ($version) { $version } else { "dev-$($env:GITHUB_SHA.Substring(0, 12))" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "bundle=recall-release-$suffix"
          "Version: $(if ($version) { $version } else { '(unversioned)' })"

  recorder-tests:
    name: tests (recorder workspace)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-dev
      # CI test builds only (never the release profile): no incremental state, line tables only,
      # which keeps the cached target small. Backtraces still name file and line.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build environment
        id: env
        uses: ./.github/actions/windows-build-env
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Restore the test build (third-party crates)
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-dev
          key: recorder-tests-${{ steps.env.outputs.tools }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: recorder-tests-${{ steps.env.outputs.tools }}-

      - name: CPU-only tests (recorder workspace)
        run: |
          # Tests that need a GPU skip on this runner with a counted HW-SKIP line (no NVENC, only
          # the Basic Render adapter). The count goes in the run summary so a mass skip is visible.
          $log = Join-Path $env:RUNNER_TEMP 'recorder-tests.log'
          cargo test --locked -p recall -p recall-hdr -p recall-nvidia -p recall-overlay -p recall-trace 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $skips = @(Select-String -LiteralPath $log -Pattern 'HW-SKIP #' | ForEach-Object { $_.Line.Trim() })
          $summary = @("### Recorder tests: $($skips.Count) GPU tests skipped (HW-SKIP)", '')
          $summary += $skips | ForEach-Object { "- ``$_``" }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
          if ($code -ne 0) { throw "recorder tests failed ($code)" }

      - name: Keep third-party crates only (for the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clean --locked -p recall -p recall-hdr -p recall-nvidia -p recall-overlay
          if ($LASTEXITCODE -ne 0) { throw "cargo clean failed ($LASTEXITCODE)" }
          "target-dev: $([math]::Round((Get-ChildItem -LiteralPath $env:CARGO_TARGET_DIR -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)) MB"

      - name: Save the test build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-dev
          key: ${{ steps.cache.outputs.cache-primary-key }}

  app-tests:
    name: tests (app)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-gpui
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build environment
        id: env
        uses: ./.github/actions/windows-build-env
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Restore the test build (third-party crates)
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-gpui
          key: app-tests-${{ steps.env.outputs.tools }}-${{ hashFiles('recall-native/Cargo.lock') }}
          restore-keys: app-tests-${{ steps.env.outputs.tools }}-

      - name: CPU-only tests (app)
        run: |
          # Skipped on this runner only, by name, and listed in the run summary; each is a tracked
          # follow-up, and the desktop gate runs all of them:
          # - two late-track audio tests: the late track decodes silent on this image's Media Foundation
          # - paced copying: this runner's disk is too slow for the pacing cap's timing bound
          $runnerSkips = @(
            'audio::stream::tests::a_clip_whose_only_track_starts_late_finishes_with_silence_before_it',
            'audio::stream::tests::a_late_second_track_leaves_the_first_one_whole',
            'services::storage::fill::tests::paced_copying_keeps_to_its_rate'
          )
          $skipArgs = @($runnerSkips | ForEach-Object { '--skip', $_ })
          $log = Join-Path $env:RUNNER_TEMP 'app-tests.log'
          cargo test --locked --manifest-path recall-native\Cargo.toml -- @skipArgs 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $skips = @(Select-String -LiteralPath $log -Pattern 'HW-SKIP' | ForEach-Object { $_.Line.Trim() })
          $summary = @("### App tests: $($skips.Count) GPU tests skipped (HW-SKIP), $($runnerSkips.Count) skipped on this runner by name", '')
          $summary += $skips | ForEach-Object { "- ``$_``" }
          $summary += $runnerSkips | ForEach-Object { "- runner skip: ``$_``" }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
          if ($code -ne 0) { throw "app tests failed ($code)" }

      - name: Keep third-party crates only (for the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clean --locked --manifest-path recall-native\Cargo.toml -p recall-native
          if ($LASTEXITCODE -ne 0) { throw "cargo clean failed ($LASTEXITCODE)" }
          "target-gpui: $([math]::Round((Get-ChildItem -LiteralPath $env:CARGO_TARGET_DIR -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)) MB"

      - name: Save the test build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-gpui
          key: ${{ steps.cache.outputs.cache-primary-key }}

  setup-tests:
    name: tests (Setup)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Release version
        env:
          INPUT_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ($env:INPUT_VERSION) { Add-Content -LiteralPath $env:GITHUB_ENV -Value "RECALL_VERSION=$env:INPUT_VERSION" }
          if ($env:INPUT_VERSION) { Add-Content -LiteralPath $env:GITHUB_ENV -Value "RECALL_SOURCE_REVISION=$env:GITHUB_SHA" }

      - name: Setup unit tests
        run: |
          # The sandbox tests run in processes of their own, a few at a time (tests/SetupTests.Parallel.cs).
          & .\scripts\setup\build.ps1 -Test -OutputPath (Join-Path $env:RUNNER_TEMP 'RecallSetupTests.exe')

  compat:
    name: compatibility
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The previous release tag, and its tree for the rollback check.
          fetch-depth: 0

      - name: Build environment
        id: env
        uses: ./.github/actions/windows-build-env
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Previous release
        id: previous
        run: |
          $here = git describe --tags --exact-match HEAD 2>$null
          $previous = git tag --list 'v*' --sort=-v:refname --merged HEAD | Where-Object { $_ -ne $here } | Select-Object -First 1
          if (-not $previous) { throw 'no earlier release tag to check against' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$previous"
          "Previous release: $previous"

      # This build's dev builds come from the test jobs' caches (read only: those jobs save them).
      - name: Restore the recorder test build (third-party crates)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-dev
          key: recorder-tests-${{ steps.env.outputs.tools }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: recorder-tests-${{ steps.env.outputs.tools }}-

      - name: Restore the app test build (third-party crates)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-gpui
          key: app-tests-${{ steps.env.outputs.tools }}-${{ hashFiles('recall-native/Cargo.lock') }}
          restore-keys: app-tests-${{ steps.env.outputs.tools }}-

      - name: Restore the previous release's build (third-party crates)
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-compat
          key: compat-${{ steps.env.outputs.tools }}-${{ steps.previous.outputs.tag }}
          restore-keys: compat-${{ steps.env.outputs.tools }}-

      - name: Compatibility (settings from earlier releases, and rollback)
        run: |
          # CONTRIBUTING.md, "Settings compatibility". Forward: every earlier release's settings
          # load with every value kept, unless a major (x.0.0) release declared the area
          # (RECALL_VERSION decides which declarations apply). Rollback: the previous release
          # reads the files this build writes and keeps them.
          $here = git describe --tags --exact-match HEAD 2>$null
          $previous = git tag --list 'v*' --sort=-v:refname --merged HEAD | Where-Object { $_ -ne $here } | Select-Object -First 1
          if (-not $previous) { throw 'no earlier release tag to check against' }
          if (-not (Test-Path "compat\settings\$previous\config.toml")) { throw "compat/settings/$previous is missing: add it with scripts/dev/compat-fixture.ps1 -Tag $previous" }
          $env:CARGO_TARGET_DIR = "$env:GITHUB_WORKSPACE\target-dev"
          cargo test --locked -p recall-hdr compatibility
          if ($LASTEXITCODE -ne 0) { throw "settings compatibility (recorder) failed ($LASTEXITCODE)" }
          $env:CARGO_TARGET_DIR = "$env:GITHUB_WORKSPACE\target-gpui"
          cargo test --locked --manifest-path recall-native\Cargo.toml compatibility
          if ($LASTEXITCODE -ne 0) { throw "settings compatibility (app) failed ($LASTEXITCODE)" }
          Remove-Item Env:CARGO_TARGET_DIR
          & .\scripts\dev\compat-rollback.ps1 -Previous $previous -TargetDir "$env:GITHUB_WORKSPACE\target-compat" -HdrTarget "$env:GITHUB_WORKSPACE\target-dev" -AppTarget "$env:GITHUB_WORKSPACE\target-gpui"
          if ($LASTEXITCODE -ne 0) { throw "rollback to $previous loses settings" }
          $majors = (Get-Content -Raw compat\rules.json | ConvertFrom-Json).major | Where-Object { $_.version -eq $env:RECALL_VERSION }
          $summary = @("### Settings compatibility: rollback to $previous checked", '')
          $summary += $majors | ForEach-Object { "- resets in $($_.version), $($_.file) ($($_.areas -join ', ')): $($_.note) -- put this in the release notes" }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Keep third-party crates only (for the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # The previous release's crates carry the same package names as this tree's.
          $env:CARGO_TARGET_DIR = "$env:GITHUB_WORKSPACE\target-compat\old-hdr"
          cargo clean --locked -p recall -p recall-hdr -p recall-nvidia -p recall-overlay
          if ($LASTEXITCODE -ne 0) { throw "cargo clean (old-hdr) failed ($LASTEXITCODE)" }
          $env:CARGO_TARGET_DIR = "$env:GITHUB_WORKSPACE\target-compat\old-app"
          cargo clean --locked --manifest-path recall-native\Cargo.toml -p recall-native
          if ($LASTEXITCODE -ne 0) { throw "cargo clean (old-app) failed ($LASTEXITCODE)" }
          "target-compat: $([math]::Round((Get-ChildItem -LiteralPath target-compat -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)) MB"

      - name: Save the previous release's build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-compat
          key: ${{ steps.cache.outputs.cache-primary-key }}

  release-recorder:
    name: release build (recorder workspace)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-dev
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build environment
        id: env
        uses: ./.github/actions/windows-build-env
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Restore the release build (third-party crates, this runner image only)
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-dev
          key: release-recorder-${{ steps.env.outputs.image }}-${{ steps.env.outputs.tools }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-recorder-${{ steps.env.outputs.image }}-${{ steps.env.outputs.tools }}-

      - name: Rebuild every Recall crate from this checkout
        run: |
          # The cache holds third-party crates only; this makes sure of it before the build.
          cargo clean --release --locked -p recall -p recall-hdr -p recall-nvidia -p recall-overlay
          if ($LASTEXITCODE -ne 0) { throw "cargo clean failed ($LASTEXITCODE)" }

      - name: Release build (recorder workspace)
        run: |
          cargo build --release --locked -p recall -p recall-hdr -p recall-nvidia -p recall-overlay
          if ($LASTEXITCODE -ne 0) { throw "recorder release build failed ($LASTEXITCODE)" }

      - name: Stage the recorder exes
        id: stage
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'recorder-exes'
          New-Item -ItemType Directory -Path $out | Out-Null
          foreach ($exe in 'recall-hdr.exe', 'recall.exe', 'recall-overlay.exe') {
            Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR "release\$exe") -Destination $out
          }
          Get-ChildItem -LiteralPath $out | ForEach-Object { "$($_.Name) $($_.Length) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "dir=$out"

      - name: Upload the recorder exes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recall-exe-recorder
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          retention-days: 1

      - name: Keep third-party crates only (for the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clean --release --locked -p recall -p recall-hdr -p recall-nvidia -p recall-overlay
          if ($LASTEXITCODE -ne 0) { throw "cargo clean failed ($LASTEXITCODE)" }
          "target-dev: $([math]::Round((Get-ChildItem -LiteralPath $env:CARGO_TARGET_DIR -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)) MB"

      - name: Save the release build (third-party crates)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-dev
          key: ${{ steps.cache.outputs.cache-primary-key }}

  release-app:
    name: release build (app)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-gpui
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build environment
        id: env
        uses: ./.github/actions/windows-build-env
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Restore the release build (third-party crates, this runner image only)
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-gpui
          key: release-app-${{ steps.env.outputs.image }}-${{ steps.env.outputs.tools }}-${{ hashFiles('recall-native/Cargo.lock') }}
          restore-keys: release-app-${{ steps.env.outputs.image }}-${{ steps.env.outputs.tools }}-

      - name: Rebuild every Recall crate from this checkout
        run: |
          # The cache holds third-party crates only; this makes sure of it before the build.
          cargo clean --release --locked --manifest-path recall-native\Cargo.toml -p recall-native
          if ($LASTEXITCODE -ne 0) { throw "cargo clean failed ($LASTEXITCODE)" }

      - name: Release build (app)
        run: |
          cargo build --release --locked --manifest-path recall-native\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "app release build failed ($LASTEXITCODE)" }

      - name: Stage the app exe
        id: stage
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'app-exe'
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release\recall-native.exe') -Destination $out
          Get-ChildItem -LiteralPath $out | ForEach-Object { "$($_.Name) $($_.Length) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "dir=$out"

      - name: Upload the app exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recall-exe-app
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          retention-days: 1

      - name: Keep third-party crates only (for the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clean --release --locked --manifest-path recall-native\Cargo.toml -p recall-native
          if ($LASTEXITCODE -ne 0) { throw "cargo clean failed ($LASTEXITCODE)" }
          "target-gpui: $([math]::Round((Get-ChildItem -LiteralPath $env:CARGO_TARGET_DIR -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)) MB"

      - name: Save the release build (third-party crates)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target-gpui
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build:
    # The payload: only after every check and both release builds passed.
    needs: [prepare, recorder-tests, app-tests, setup-tests, compat, release-recorder, release-app]
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      signing: ${{ needs.prepare.outputs.signing }}
      version: ${{ needs.prepare.outputs.version }}
      bundle: ${{ needs.prepare.outputs.bundle }}
      payload-artifact-id: ${{ steps.payload.outputs.artifact-id }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Release version
        env:
          INPUT_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The uninstaller's version (build.ps1 reads RECALL_VERSION).
          if ($env:INPUT_VERSION) { Add-Content -LiteralPath $env:GITHUB_ENV -Value "RECALL_VERSION=$env:INPUT_VERSION" }
          if ($env:INPUT_VERSION) { Add-Content -LiteralPath $env:GITHUB_ENV -Value "RECALL_SOURCE_REVISION=$env:GITHUB_SHA" }

      - name: Fetch the recorder exes
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: recall-exe-recorder
          path: ${{ runner.temp }}\payload

      - name: Fetch the app exe
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: recall-exe-app
          path: ${{ runner.temp }}\payload

      - name: Assemble and check the payload
        id: stage
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          foreach ($exe in 'recall-native.exe', 'recall-hdr.exe', 'recall.exe', 'recall-overlay.exe') {
            if (!(Test-Path -LiteralPath (Join-Path $payload $exe) -PathType Leaf)) { throw "The release builds did not deliver $exe" }
          }
          & .\scripts\setup\build.ps1 -UninstallerOnly -OutputPath (Join-Path $payload 'RecallUninstall.exe') | Out-Null
          & .\scripts\setup\check-versions.ps1 -Directory $payload -Version $env:VERSION -Count 5
          Get-ChildItem -LiteralPath $payload -File | ForEach-Object { "$($_.Name) $($_.Length) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "dir=$payload"

      - name: Upload the payload (unsigned)
        id: payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recall-payload-unsigned
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          retention-days: 7

  sign-payload:
    needs: build
    if: needs.build.outputs.signing == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    # Required reviewers on this environment approve every signing request.
    environment: release-signing
    permissions:
      contents: read
      # SignPath fetches the unsigned artifact through the Actions API.
      actions: read
    steps:
      - name: Check out (the verification script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Submit the signing request (the five payload exes)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'recall' }}
          signing-policy-slug: ${{ vars.SIGNPATH_PAYLOAD_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PAYLOAD_CONFIG_SLUG || 'payload' }}
          github-artifact-id: ${{ needs.build.outputs.payload-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\payload-signed

      - name: Verify every signature and version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          & .\scripts\setup\check-versions.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'payload-signed') -Version $env:VERSION -Count 5 -Signed

      - name: Upload the signed payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recall-payload-signed
          path: ${{ runner.temp }}\payload-signed
          if-no-files-found: error
          retention-days: 7

  setup:
    # Every check job is named here too (not only through build): with always(), each must say success.
    needs: [build, sign-payload, recorder-tests, app-tests, setup-tests, compat]
    # Runs after the payload is signed, or straight after build when signing is not configured.
    if: >-
      always() && needs.build.result == 'success' &&
      needs.recorder-tests.result == 'success' && needs.app-tests.result == 'success' &&
      needs.setup-tests.result == 'success' && needs.compat.result == 'success' &&
      (needs.sign-payload.result == 'success' || (needs.sign-payload.result == 'skipped' && needs.build.outputs.signing != 'true'))
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      setup-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    env:
      RECALL_VERSION: ${{ needs.build.outputs.version }}
      RECALL_SOURCE_REVISION: ${{ needs.build.outputs.version && github.sha || '' }}
      SIGNING: ${{ needs.build.outputs.signing }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch the payload
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build.outputs.signing == 'true' && 'recall-payload-signed' || 'recall-payload-unsigned' }}
          path: ${{ runner.temp }}\payload

      - name: Build Setup around the payload
        id: bundle
        env:
          BUNDLE: ${{ needs.build.outputs.bundle }}
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          $signedArgs = if ($env:SIGNING -eq 'true') { @{ Signed = $true } } else { @{} }
          & .\scripts\setup\check-versions.ps1 -Directory $payload -Version $env:RECALL_VERSION -Count 5 @signedArgs
          $out = Join-Path $env:RUNNER_TEMP $env:BUNDLE
          $app = Join-Path $out 'recall-app'
          New-Item -ItemType Directory -Path $app | Out-Null
          Copy-Item -Path (Join-Path $payload '*.exe') -Destination $app
          $setup = Join-Path $out 'RecallSetup.exe'
          $uninstaller = Join-Path $payload 'RecallUninstall.exe'
          & .\scripts\setup\build.ps1 -PayloadDirectory $payload -UninstallerPath $uninstaller -OnlineDependencies -OutputPath $setup | Out-Null
          $setupOnly = Join-Path $env:RUNNER_TEMP 'setup-unsigned'
          New-Item -ItemType Directory -Path $setupOnly | Out-Null
          Copy-Item -LiteralPath $setup -Destination $setupOnly
          & .\scripts\setup\check-versions.ps1 -Directory $setupOnly -Version $env:RECALL_VERSION -Count 1
          $sha = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Value "$sha  RecallSetup.exe" -Encoding ascii
          Set-Content -LiteralPath (Join-Path $out 'SOURCE-REVISION.txt') -Value $env:GITHUB_SHA -Encoding ascii
          # scripts/release.ps1 refuses an unsigned Setup from a bundle carrying this marker.
          if ($env:SIGNING -eq 'true') {
            Set-Content -LiteralPath (Join-Path $out 'SIGNPATH_CONFIGURED') -Value 'signing required' -Encoding ascii
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "dir=$out"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "setup-dir=$setupOnly"
          "Built $env:BUNDLE ($sha)"

      - name: Upload the bundle (Setup unsigned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: ${{ steps.bundle.outputs.dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Setup for signing (unsigned)
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RecallSetup-unsigned
          path: ${{ steps.bundle.outputs.setup-dir }}
          if-no-files-found: error
          retention-days: 7

  sign-setup:
    needs: [build, setup]
    if: needs.build.outputs.signing == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release-signing
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out (the verification script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Submit the signing request (Setup)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'recall' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SETUP_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIG_SLUG || 'setup' }}
          github-artifact-id: ${{ needs.setup.outputs.setup-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signed

      - name: Fetch the bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: ${{ runner.temp }}\bundle

      - name: Verify the signature and assemble the signed bundle
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $signedDir = Join-Path $env:RUNNER_TEMP 'signed'
          $bundle = Join-Path $env:RUNNER_TEMP 'bundle'
          & .\scripts\setup\check-versions.ps1 -Directory $signedDir -Version $env:VERSION -Count 1 -Signed
          & .\scripts\setup\check-versions.ps1 -Directory (Join-Path $bundle 'recall-app') -Version $env:VERSION -Count 5 -Signed
          $signed = Join-Path $signedDir 'RecallSetup.exe'
          Copy-Item -LiteralPath $signed -Destination (Join-Path $bundle 'RecallSetup.exe') -Force
          $sha = (Get-FileHash -LiteralPath $signed -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $bundle 'SHA256SUMS.txt') -Value "$sha  RecallSetup.exe" -Encoding ascii
          Set-Content -LiteralPath (Join-Path $bundle 'SIGNPATH_CONFIGURED') -Value 'signing required' -Encoding ascii
          "Signed Setup: $sha"

      - name: Upload the signed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.build.outputs.bundle }}-signed
          path: ${{ runner.temp }}\bundle
          if-no-files-found: error
          retention-days: 30
